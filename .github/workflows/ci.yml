name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual runs also execute the native dependency matrix.
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-native-changes:
    # Detect native source changes without running expensive builds on every push.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.filter.outputs.native }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history lets the filter compare the correct base and head commits.
          fetch-depth: 0

      - name: Detect native dependency inputs
        id: filter
        uses: dorny/paths-filter@v3
        with:
          # Compare pushes with the event's actual previous commit; comparing against
          # the last failed run can otherwise hide the same native changes on a retry.
          base: ${{ github.event.before }}
          # Changes to the native scripts or this workflow can affect sysroot builds.
          filters: |
            native:
              - 'native/scripts/**'
              - '.github/workflows/ci.yml'

  build:
    name: Build Android debug APK and verify JNI ABIs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The legacy SDK 'tools' package is no longer published; install only platform-tools.
          packages: 'platform-tools'

      - name: Install Android SDK, NDK, and CMake packages
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Validate shell scripts
        shell: bash
        run: |
          set -euo pipefail
          # Parse every script independently; bash -n with multiple script
          # arguments only parses the first file.
          while IFS= read -r -d '' script; do
            echo "Checking ${script}"
            bash -n "${script}"
          done < <(find native/scripts -maxdepth 1 -type f -name '*.sh' -print0)

      - name: Build debug APK for configured Android ABIs
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK contains JNI libraries for both ABIs
        run: bash native/scripts/verify-android-apk.sh app/build/outputs/apk/debug/app-debug.apk

      - name: Verify adaptive launcher icon resources
        shell: bash
        run: |
          set -euo pipefail
          # Parse the launcher XML resources so malformed adaptive or vector icons fail CI.
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET

          root = pathlib.Path("app/src/main/res")
          required = [
              root / "drawable/emu_launcher_background.xml",
              root / "drawable/emu_launcher_foreground.xml",
              root / "drawable/emu_launcher_monochrome.xml",
              root / "mipmap-anydpi-v26/ic_launcher.xml",
              pathlib.Path("app/src/main/AndroidManifest.xml"),
          ]
          for resource in required:
              if not resource.is_file():
                  raise SystemExit(f"Missing launcher resource: {resource}")
              ET.parse(resource)
              print(f"Validated {resource}")
          PY
          # Ensure the built APK contains the compiled launcher resource table.
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'resources.arsc'


      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: emu-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  native-dependencies:
    # Run manually or automatically when native build inputs change.
    needs: detect-native-changes
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.detect-native-changes.outputs.native == 'true') }}
    name: Build native dependency sysroot (${{ matrix.abi }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Build each Android ABI in an isolated runner and sysroot.
        abi: [arm64-v8a, x86_64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native host build tools
        run: |
          # Install host-side tools required by CMake, Autoconf, and Meson.
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            cmake \
            curl \
            git \
            meson \
            ninja-build \
            pkg-config \
            python3 \
            python3-pip \
            tar

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The legacy SDK 'tools' package is no longer published.
          packages: 'platform-tools'

      - name: Install Android NDK
        run: |
          # Pin the NDK version used by the application and cross-build scripts.
          sdkmanager --install "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_API=28" >> "$GITHUB_ENV"
          echo "CMAKE_BUILD_PARALLEL_LEVEL=2" >> "$GITHUB_ENV"

      - name: Validate native shell scripts
        shell: bash
        run: |
          set -euo pipefail
          # Parse each native script independently before executing the build.
          while IFS= read -r -d '' script; do
            echo "Checking ${script}"
            bash -n "${script}"
          done < <(find native/scripts -maxdepth 1 -type f -name '*.sh' -print0)

      - name: Build and verify Android dependency sysroot
        run: bash native/scripts/build-android-deps.sh "${{ matrix.abi }}"

      - name: Fetch pinned QEMU source
        run: bash native/scripts/fetch-qemu.sh

      - name: Cross-build QEMU system emulator and qemu-img
        env:
          # Reuse the ABI-specific dependency sysroot built immediately above.
          QEMU_ANDROID_SYSROOT: ${{ github.workspace }}/.work/sysroots/${{ matrix.abi }}
          QEMU_PKG_CONFIG_LIBDIR: ${{ github.workspace }}/.work/sysroots/${{ matrix.abi }}/usr/lib/pkgconfig:${{ github.workspace }}/.work/sysroots/${{ matrix.abi }}/usr/share/pkgconfig
          QEMU_SOURCE_DIR: ${{ github.workspace }}/.work/qemu
          QEMU_BUILD_ROOT: ${{ github.workspace }}/.work/qemu-build
          QEMU_TOOL_WRAPPER_ROOT: ${{ github.workspace }}/.work/toolchain
        run: bash native/scripts/build-qemu-android.sh "${{ matrix.abi }}"

      - name: Upload QEMU Android binaries
        uses: actions/upload-artifact@v4
        with:
          name: emu-qemu-9.2.0-${{ matrix.abi }}
          path: |
            .work/qemu-build/${{ matrix.abi }}/qemu-system-aarch64
            .work/qemu-build/${{ matrix.abi }}/qemu-img
          if-no-files-found: error
          retention-days: 7

      - name: Upload Android dependency sysroot
        uses: actions/upload-artifact@v4
        with:
          name: emu-native-sysroot-${{ matrix.abi }}
          path: .work/sysroots/${{ matrix.abi }}/
          if-no-files-found: error
          retention-days: 7
