name: Android CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  # Manual runs also execute the native dependency matrix.
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-native-changes:
    # Rebuild QEMU only when its source, build scripts, or native integration changes.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      # Rebuild QEMU when native inputs change or no retained ABI artifacts can be reused.
      native: ${{ steps.filter.outputs.native == 'true' || steps.runtime-artifacts.outputs.reusable != 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect native dependency inputs
        id: filter
        uses: dorny/paths-filter@v3
        with:
          base: ${{ github.event.before }}
          filters: |
            native:
              - 'native/**'
              - 'app/src/main/cpp/**'
              - '.github/workflows/ci.yml'

      - name: Check reusable QEMU runtime artifacts
        id: runtime-artifacts
        if: steps.filter.outputs.native != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          reusable=false
          while IFS= read -r candidate; do
            [[ -z "$candidate" ]] && continue
            artifacts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate/artifacts" --jq '[.artifacts[] | select(.expired == false) | .name]' 2>/dev/null || echo '[]')"
            if jq -e 'index("emu-qemu-9.2.0-arm64-v8a") != null and index("emu-qemu-9.2.0-x86_64") != null' <<< "$artifacts" >/dev/null; then
              reusable=true
              echo "Reusable QEMU ABI artifacts found in workflow run $candidate"
              break
            fi
          done < <(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=dev&status=success&per_page=30" --jq '.workflow_runs[].id')
          echo "reusable=$reusable" >> "$GITHUB_OUTPUT"
          if [[ "$reusable" != true ]]; then
            echo "No retained QEMU ABI artifacts found; native dependency build will run."
          fi

  build:
    name: Build Android debug APK and verify JNI ABIs
    needs: [detect-native-changes, native-dependencies]
    if: ${{ always() && (needs.detect-native-changes.result == 'success' || github.event_name == 'workflow_dispatch') && (needs.native-dependencies.result == 'success' || needs.native-dependencies.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The legacy SDK 'tools' package is no longer published; install only platform-tools.
          packages: 'platform-tools'

      - name: Install Android SDK, NDK, and CMake packages
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Validate shell scripts
        shell: bash
        run: |
          set -euo pipefail
          # Parse every script independently; bash -n with multiple script
          # arguments only parses the first file.
          while IFS= read -r -d '' script; do
            echo "Checking ${script}"
            bash -n "${script}"
          done < <(find native/scripts tools -maxdepth 1 -type f -name '*.sh' -print0)

      - name: Resolve QEMU runtime artifact run
        id: qemu-artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ needs.native-dependencies.result }}" == "success" ]]; then
            echo "run_id=$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Reuse the latest successful dev-branch native build for app-only changes.
          while IFS= read -r candidate; do
            [[ -z "$candidate" || "$candidate" == "$GITHUB_RUN_ID" ]] && continue
            artifacts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate/artifacts" --jq '[.artifacts[] | select(.expired == false) | .name]')"
            if jq -e 'index("emu-qemu-9.2.0-arm64-v8a") != null and index("emu-qemu-9.2.0-x86_64") != null' <<< "$artifacts" >/dev/null; then
              echo "run_id=$candidate" >> "$GITHUB_OUTPUT"
              echo "Reusing QEMU runtime artifacts from workflow run $candidate"
              exit 0
            fi
          done < <(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=dev&status=success&per_page=30" --jq '.workflow_runs[].id')

          echo "ERROR: no unexpired successful QEMU ABI artifacts were found; run Android CI manually to rebuild them." >&2
          exit 1

      - name: Download QEMU runtime for arm64-v8a
        uses: actions/download-artifact@v4
        with:
          name: emu-qemu-9.2.0-arm64-v8a
          path: .work/qemu/arm64-v8a
          run-id: ${{ steps.qemu-artifacts.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download QEMU runtime for x86_64
        uses: actions/download-artifact@v4
        with:
          name: emu-qemu-9.2.0-x86_64
          path: .work/qemu/x86_64
          run-id: ${{ steps.qemu-artifacts.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage ABI-specific QEMU runtime assets
        shell: bash
        run: |
          set -euo pipefail
          for abi in arm64-v8a x86_64; do
            destination="app/src/main/assets/qemu/$abi"
            mkdir -p "$destination"
            install -m 0755 ".work/qemu/$abi/qemu-system-aarch64" "$destination/qemu-system-aarch64"
            install -m 0755 ".work/qemu/$abi/qemu-img" "$destination/qemu-img"
            # Bind the manifest to the exact executables staged into the APK.
            (cd "$destination" && sha256sum qemu-system-aarch64 qemu-img > SHA256SUMS)
            chmod 0644 "$destination/SHA256SUMS"
            (cd "$destination" && sha256sum --check SHA256SUMS)
          done

      - name: Stage pinned AAVMF AArch64 UEFI firmware
        run: bash tools/stage-aavmf-firmware.sh

      - name: Download SDL2 static library for arm64-v8a
        uses: actions/download-artifact@v4
        with:
          name: emu-sdl2-2.30.12-arm64-v8a
          path: .work/sdl2/arm64-v8a

      - name: Download SDL2 static library for x86_64
        uses: actions/download-artifact@v4
        with:
          name: emu-sdl2-2.30.12-x86_64
          path: .work/sdl2/x86_64

      - name: Verify staged SDL2 libraries
        shell: bash
        run: |
          set -euo pipefail
          for abi in arm64-v8a x86_64; do
            test -s ".work/sdl2/$abi/usr/lib/libSDL2.a"
            test -s ".work/sdl2/$abi/usr/include/SDL2/SDL.h"
          done

      - name: Build debug APK for configured Android ABIs
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK contains JNI libraries for both ABIs
        run: bash native/scripts/verify-android-apk.sh app/build/outputs/apk/debug/app-debug.apk

      - name: Verify SDL2 is linked into both Android JNI libraries
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          for abi in arm64-v8a x86_64; do
            message="$(unzip -p "$apk" "lib/$abi/libemu-qemu.so" | strings | grep -F "SDL2 %u.%u.%u is linked" || true)"
            if [[ -z "$message" ]]; then
              echo "ERROR: SDL2 link marker missing from $abi JNI library" >&2
              exit 1
            fi
            echo "Verified SDL2 linkage marker in $abi JNI library"
          done

      - name: Verify adaptive launcher icon resources
        shell: bash
        run: |
          set -euo pipefail
          # Parse the launcher XML resources so malformed adaptive or vector icons fail CI.
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET

          root = pathlib.Path("app/src/main/res")
          required = [
              root / "drawable/emu_launcher_background.xml",
              root / "drawable/emu_launcher_foreground.xml",
              root / "drawable/emu_launcher_monochrome.xml",
              root / "mipmap-anydpi-v26/ic_launcher.xml",
              pathlib.Path("app/src/main/AndroidManifest.xml"),
          ]
          for resource in required:
              if not resource.is_file():
                  raise SystemExit(f"Missing launcher resource: {resource}")
              ET.parse(resource)
              print(f"Validated {resource}")
          PY
          # Ensure the built APK contains the compiled launcher resource table.
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'resources.arsc'


      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: emu-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  native-dependencies:
    needs: detect-native-changes
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.detect-native-changes.outputs.native == 'true') }}
    name: Build native dependency sysroot (${{ matrix.abi }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Build each Android ABI in an isolated runner and sysroot.
        abi: [arm64-v8a, x86_64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native host build tools
        run: |
          # Install host-side tools required by CMake, Autoconf, and Meson.
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            cmake \
            curl \
            git \
            meson \
            ninja-build \
            pkg-config \
            patchelf \
            python3 \
            python3-pip \
            tar

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The legacy SDK 'tools' package is no longer published.
          packages: 'platform-tools'

      - name: Install Android NDK
        run: |
          # Pin the NDK version used by the application and cross-build scripts.
          sdkmanager --install "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_API=28" >> "$GITHUB_ENV"
          echo "CMAKE_BUILD_PARALLEL_LEVEL=2" >> "$GITHUB_ENV"

      - name: Validate native shell scripts
        shell: bash
        run: |
          set -euo pipefail
          # Parse each native script independently before executing the build.
          while IFS= read -r -d '' script; do
            echo "Checking ${script}"
            bash -n "${script}"
          done < <(find native/scripts -maxdepth 1 -type f -name '*.sh' -print0)

      - name: Build and verify Android dependency sysroot
        run: bash native/scripts/build-android-deps.sh "${{ matrix.abi }}"

      - name: Build pinned SDL2 for Android
        env:
          QEMU_ANDROID_SYSROOT: ${{ github.workspace }}/.work/sysroots/${{ matrix.abi }}
        run: bash native/scripts/build-sdl2-android.sh "${{ matrix.abi }}"

      - name: Verify and upload SDL2 Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: emu-sdl2-2.30.12-${{ matrix.abi }}
          path: |
            .work/sysroots/${{ matrix.abi }}/usr/lib/libSDL2.a
            .work/sysroots/${{ matrix.abi }}/usr/include/SDL2/
            .work/sysroots/${{ matrix.abi }}/share/SDL2/android-java/
          if-no-files-found: error
          retention-days: 1

      - name: Fetch pinned QEMU source
        run: bash native/scripts/fetch-qemu.sh

      - name: Cross-build QEMU system emulator and qemu-img
        env:
          # Reuse the ABI-specific dependency sysroot built immediately above.
          QEMU_ANDROID_SYSROOT: ${{ github.workspace }}/.work/sysroots/${{ matrix.abi }}
          QEMU_PKG_CONFIG_LIBDIR: ${{ github.workspace }}/.work/sysroots/${{ matrix.abi }}/usr/lib/pkgconfig:${{ github.workspace }}/.work/sysroots/${{ matrix.abi }}/usr/share/pkgconfig
          QEMU_SOURCE_DIR: ${{ github.workspace }}/.work/qemu
          QEMU_BUILD_ROOT: ${{ github.workspace }}/.work/qemu-build
          QEMU_TOOL_WRAPPER_ROOT: ${{ github.workspace }}/.work/toolchain
        run: bash native/scripts/build-qemu-android.sh "${{ matrix.abi }}"

      - name: Inspect Android QEMU ELF dependencies
        env:
          QEMU_BUILD_ROOT: ${{ github.workspace }}/.work/qemu-build
        run: bash native/scripts/inspect-qemu-android-elf.sh "${{ matrix.abi }}"

      - name: Upload QEMU Android binaries
        uses: actions/upload-artifact@v4
        with:
          name: emu-qemu-9.2.0-${{ matrix.abi }}
          path: |
            .work/qemu-build/${{ matrix.abi }}/qemu-system-aarch64
            .work/qemu-build/${{ matrix.abi }}/qemu-img
          if-no-files-found: error
          retention-days: 90

      # Preserve unstripped QEMU object files and build metadata. Together with
      # the corresponding source and static dependency sysroot, these are the
      # inputs needed to investigate/relink the statically linked LGPL stack.
      - name: Upload QEMU relink materials
        uses: actions/upload-artifact@v4
        with:
          name: emu-qemu-9.2.0-relink-materials-${{ matrix.abi }}
          path: .work/qemu-build/${{ matrix.abi }}/
          if-no-files-found: error
          retention-days: 90

      - name: Assemble QEMU corresponding-source bundle
        if: matrix.abi == 'arm64-v8a'
        run: bash native/scripts/create-qemu-source-bundle.sh

      - name: Upload QEMU corresponding-source bundle
        if: matrix.abi == 'arm64-v8a'
        uses: actions/upload-artifact@v4
        with:
          name: emu-qemu-9.2.0-corresponding-source
          path: |
            .work/source-bundle/emu-qemu-9.2.0-corresponding-source.tar.xz
            .work/source-bundle/emu-qemu-9.2.0-corresponding-source.tar.xz.sha256
          if-no-files-found: error
          retention-days: 90


      # Validate the retained object files, Meson/Ninja metadata, and matching
      # ABI-specific dependency archives before the artifacts are published.
      - name: Verify QEMU relink materials
        env:
          QEMU_BUILD_ROOT: ${{ github.workspace }}/.work/qemu-build
          QEMU_ANDROID_SYSROOT: ${{ github.workspace }}/.work/sysroots/${{ matrix.abi }}
        run: bash native/scripts/verify-qemu-relink-materials.sh "${{ matrix.abi }}"

      - name: Upload Android dependency sysroot
        uses: actions/upload-artifact@v4
        with:
          name: emu-native-sysroot-${{ matrix.abi }}
          path: .work/sysroots/${{ matrix.abi }}/
          if-no-files-found: error
          retention-days: 90
