name: Android Native Dependencies

on:
  # Run this resource-intensive matrix manually after reviewing native changes.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-sysroot:
    name: Build native dependency sysroot (${{ matrix.abi }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Keep each Android ABI in a separate runner and dependency sysroot.
        abi: [arm64-v8a, x86_64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native host build tools
        run: |
          # Install the host-side tools used by CMake, Autoconf, and Meson.
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            cmake \
            curl \
            git \
            meson \
            ninja-build \
            pkg-config \
            python3 \
            python3-pip \
            tar

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The legacy SDK 'tools' package is no longer published.
          packages: 'platform-tools'

      - name: Install Android NDK
        run: |
          # Pin the NDK version used by the app and native cross-build scripts.
          sdkmanager --install "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_API=28" >> "$GITHUB_ENV"
          echo "CMAKE_BUILD_PARALLEL_LEVEL=2" >> "$GITHUB_ENV"

      - name: Validate native shell scripts
        shell: bash
        run: |
          set -euo pipefail
          # Parse every native script independently before executing builds.
          while IFS= read -r -d '' script; do
            echo "Checking ${script}"
            bash -n "${script}"
          done < <(find native/scripts -maxdepth 1 -type f -name '*.sh' -print0)

      - name: Build and verify Android dependency sysroot
        run: bash native/scripts/build-android-deps.sh "${{ matrix.abi }}"

      - name: Upload verified Android dependency sysroot
        uses: actions/upload-artifact@v4
        with:
          name: emu-native-sysroot-${{ matrix.abi }}
          path: .work/sysroots/${{ matrix.abi }}/
          if-no-files-found: error
          retention-days: 7
